name: Tests

# Runs on every push and pull request. Publishing is publish.yml (main + version bump).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      # Coverage against codegen/openapi.json, upload field whitelists, parity tests.
      - run: npm test

      - name: Generated methods match codegen/openapi.json
        run: python3 codegen/generate.py --check

      - name: Type declarations compile
        run: npx tsc --noEmit --strict --types node index.d.ts
